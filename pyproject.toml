[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ezqens"
version = "0.1.0"
description = "Standardized analysis of reduced quasielastic neutron scattering data."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ezqens"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
